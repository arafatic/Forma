<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Inner Glow / Shadow Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Vector Node Glow -->
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle (macOS continuous corner curvature) -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" />
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#highlightGrad)" />
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Pen Curve / Bézier Guide Wave -->
  <path d="M 240 760 C 240 500, 420 320, 784 320" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.4" stroke-dasharray="24 16" />

  <!-- Stylized Geometric Bold "F" Icon -->
  <!-- Stem -->
  <rect x="300" y="260" width="100" height="504" rx="28" fill="#ffffff" filter="url(#nodeShadow)" />

  <!-- Top Bar -->
  <rect x="300" y="260" width="424" height="100" rx="28" fill="#ffffff" filter="url(#nodeShadow)" />

  <!-- Middle Bar with Handle Direction -->
  <rect x="300" y="462" width="280" height="92" rx="26" fill="#ffffff" filter="url(#nodeShadow)" />

  <!-- Vector Anchor Points & Handles (Evoking Vector Precision) -->
  <!-- Handle Line 1 -->
  <line x1="724" y1="310" x2="824" y2="310" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="824" cy="310" r="14" fill="#38bdf8" />

  <!-- Handle Line 2 -->
  <line x1="300" y1="764" x2="190" y2="764" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="190" cy="764" r="14" fill="#38bdf8" />

  <!-- Cyan Anchor Points on "F" Corners -->
  <rect x="694" y="280" width="60" height="60" rx="10" fill="#38bdf8" stroke="#ffffff" stroke-width="8" filter="url(#nodeShadow)" />
  <rect x="550" y="478" width="60" height="60" rx="10" fill="#38bdf8" stroke="#ffffff" stroke-width="8" filter="url(#nodeShadow)" />
  <rect x="270" y="734" width="60" height="60" rx="10" fill="#38bdf8" stroke="#ffffff" stroke-width="8" filter="url(#nodeShadow)" />
</svg>
